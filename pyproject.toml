[project]
name = "support-knowledge-assistant"
version = "0.1.0"
description = "Support assistant over PostgreSQL docs and internal notes: hybrid retrieval, access control, required citations, refusals."
readme = "README.md"
authors = [
    { name = "Idris-Michael Bakare", email = "idris@severusconnects.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.44.8",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langchain-core>=1.8.4",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.24",
    "lxml>=6.1.3",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[bedrock-agent-runtime]>=1.44.7",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "testcontainers[postgres]>=4.15.0",
    "types-beautifulsoup4>=4.12.0.20250516",
]

[project.scripts]
ska = "support_knowledge_assistant.cli:main"
