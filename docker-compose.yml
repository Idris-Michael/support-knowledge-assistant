services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ska
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ska}
      POSTGRES_DB: ska
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ska -d ska"]
      interval: 2s
      retries: 30

volumes:
  db:
