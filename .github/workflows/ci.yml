name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commit SHAs (tags can be repointed); Dependabot keeps the pins current.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, types, tests (incl. pgvector via testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest  # fails under 80% coverage; Docker on the runner backs the Postgres tests
      - name: Gold questions still point at real sections
        run: |
          uv run python - <<'PY'
          import json
          ids = {json.loads(l)["id"] for l in open("corpus/sections.jsonl", encoding="utf-8")}
          for line in open("bench/questions.jsonl", encoding="utf-8"):
              q = json.loads(line)
              for g in q["gold"]:
                  ok = any(i.startswith(g[:-1]) for i in ids) if g.endswith("#*") else g in ids
                  assert ok, f"{q['id']}: {g} not in corpus"
          print("gold labels resolve")
          PY

  infra:
    name: Terraform (${{ matrix.cloud }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cloud: [azure, aws]
    defaults:
      run:
        working-directory: infra/${{ matrix.cloud }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --format compact
      - name: Checkov
        uses: bridgecrewio/checkov-action@b17b606d6ec72bb8ba5721ad5b7e340b80a9fc39 # v12
        with:
          directory: infra/${{ matrix.cloud }}
          framework: terraform
          quiet: true

  security:
    name: Secrets, SAST and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The CLI directly, pinned and checksum-verified. (gitleaks-action scans "first commit's
      # parent..HEAD", which fails on a new repository's first push.)
      - name: Gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tar.gz "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" checksums.txt | awk '{print $1"  gitleaks.tar.gz"}' | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan --config p/default --error --metrics=off --exclude .venv
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          artifact-name: sbom.cdx.json

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Stack starts, answers with a citation, and keeps restricted notes from a customer
        run: |
          cp .env.example .env
          # No Ollama or Claude on the runner: hash embeddings, keyword retrieval, offline model.
          sed -i 's/^EMBED_PROVIDER=.*/EMBED_PROVIDER=hash/; s/^RETRIEVE_MODE=.*/RETRIEVE_MODE=keyword/' .env
          docker compose up -d --build --wait api
          ask() {
            curl -sf -H "authorization: Bearer $1" -H 'content-type: application/json' \
              -d "{\"question\": \"$2\"}" http://127.0.0.1:8080/v1/ask
          }
          CUSTOMER=change-me-customer-token-0000000000
          SRE=change-me-sre-token-000000000000000
          ask "$CUSTOMER" "Does VACUUM FULL lock the table while it runs?" > a.json
          python3 -c "import json; d=json.load(open('a.json')); print(d['outcome'], d['citations']); assert d['outcome']=='answered' and d['citations']"
          ask "$CUSTOMER" "What is the break-glass procedure for superuser access to production?" > b.json
          python3 -c "import json; d=json.load(open('b.json')); s=[x['section_id'] for x in d['sources']]; print(d['outcome'], s); assert not any(i.startswith('internal/') for i in s); assert 'KESTREL' not in d['answer']"
          ask "$SRE" "What is the break-glass procedure for superuser access to production?" > c.json
          python3 -c "import json; d=json.load(open('c.json')); s=[x['section_id'] for x in d['sources']]; print(s); assert any(i.startswith('internal/sre-break-glass') for i in s)"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -d '{"question":"x"}' http://127.0.0.1:8080/v1/ask)
          test "$code" = "401"
          test "$(docker compose exec -T api id -u)" = "10001"
      - if: failure()
        run: docker compose logs --no-color | tail -100

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
